services:
  # 1. MySQL Database Container
  db:
    image: mysql:8.0
    container_name: portfolio_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: portfolio_db
    ports:
      - "3307:3306" # <-- Fixed port to bypass Windows conflict
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - portfolio_net

  # 2. Node.js Express Backend API Container
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio_server_container
    restart: always
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root_password_123
      DB_NAME: portfolio_db
      DB_PORT: 3306
      JWT_SECRET: super_secret_jwt_key_2026
      ADMIN_EMAIL: kasarmayuresh99@gmail.com
      ADMIN_PASSWORD_HASH: "$$2a$$10$$wTInaDhhzC44QUnmP1s65e8/1Q3U46sI4r5P/.w5Jv6YjE7l7I.8G"
      CLOUD_NAME: ${CLOUD_NAME:-demo}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-1234567890}
      CLOUD_API_SECRET: ${CLOUD_API_SECRET:-secret}
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - portfolio_net

  # 3. React Frontend + Nginx Web Server Container
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: portfolio_client_container
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - portfolio_net

volumes:
  mysql_data:

networks:
  portfolio_net:
    driver: bridge