name: CI/CD Docker Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. Lint & Validate Dockerfiles
  dockerfile-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "server/Dockerfile"

      - name: Hadolint Client Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "client/Dockerfile"

  # 2. Build and Test Container Stack
  build-and-test:
    name: Build & Test Full Stack
    runs-on: ubuntu-latest
    needs: dockerfile-lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: Launch Application Containers
        run: docker compose up -d

      - name: Wait for MySQL Health Check
        run: |
          echo "Waiting for MySQL database container to initialize..."
          sleep 15

      - name: Test Server API Endpoint
        run: |
          response=$(curl --write-out '%{http_code}' --silent --output /dev/null http://localhost:5000/api/projects)
          if [ "$response" -eq 200 ] || [ "$response" -eq 404 ]; then
            echo "API Server is healthy (Status: $response)"
          else
            echo "API Health Check failed with status $response"
            docker compose logs server
            exit 1
          fi

      - name: Test Client Nginx Endpoint
        run: |
          response=$(curl --write-out '%{http_code}' --silent --output /dev/null http://localhost:80/)
          if [ "$response" -eq 200 ]; then
            echo "Frontend Client is healthy (Status: $response)"
          else
            echo "Frontend Health Check failed with status $response"
            docker compose logs client
            exit 1
          fi

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v