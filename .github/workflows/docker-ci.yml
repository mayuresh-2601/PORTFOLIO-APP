name: CI/CD Docker Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dockerfile-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint Server Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: server/Dockerfile

      - name: Lint Client Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: client/Dockerfile

  build-and-test:
    name: Build & Test Full Stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: dockerfile-lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: Start Containers
        run: docker compose up -d

      - name: Wait for Services
        run: |
          echo "Waiting for containers..."

          for i in {1..12}
          do
            if curl -fs http://localhost:5000/api/projects > /dev/null; then
              echo "Backend is ready."
              break
            fi

            echo "Waiting..."
            sleep 5
          done

      - name: Test Backend API
        run: |
          STATUS=$(curl \
            --write-out "%{http_code}" \
            --silent \
            --output /dev/null \
            http://localhost:5000/api/projects)

          if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then
            echo "Backend API OK ($STATUS)"
          else
            echo "Backend API Failed ($STATUS)"
            docker compose logs server
            exit 1
          fi

      - name: Test Frontend
        run: |
          STATUS=$(curl \
            --write-out "%{http_code}" \
            --silent \
            --output /dev/null \
            http://localhost)

          if [ "$STATUS" = "200" ]; then
            echo "Frontend OK ($STATUS)"
          else
            echo "Frontend Failed ($STATUS)"
            docker compose logs client
            exit 1
          fi

      - name: Upload Logs on Failure
        if: failure()
        run: |
          mkdir logs
          docker compose logs > logs/docker.log

      - name: Upload Workflow Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: logs

      - name: Stop Containers
        if: always()
        run: docker compose down -v