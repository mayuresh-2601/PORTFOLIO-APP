name: Docker CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dockerfile-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint Server Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: server/Dockerfile

      - name: Lint Client Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: client/Dockerfile

  build-and-test:
    name: Build & Test Full Stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: dockerfile-lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # docker-compose.yml requires server/.env (via env_file) and a root
      # .env (for ${DB_PASSWORD} / ${DB_NAME} substitution). Both are
      # correctly gitignored and don't exist on the CI runner, which is
      # why "Validate Docker Compose Configuration" was failing. This step
      # generates CI-only, non-production values so the stack can boot for
      # a smoke test. These values are never used outside this workflow run.
      - name: Create env files for CI
        run: |
          cat <<'EOF' > server/.env
          PORT=5000
          CLIENT_URL=http://localhost

          DB_HOST=db
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=ci_test_password
          DB_NAME=portfolio_ci

          # CI's database is a local Docker MySQL container with a
          # self-signed cert, not TiDB Cloud's real CA-signed cert.
          # Strict SSL validation would fail here, so it's explicitly
          # disabled for this workflow only.
          DB_SSL=false

          JWT_SECRET=ci_test_jwt_secret_not_for_production

          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD_HASH=$2b$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy

          CLOUD_NAME=ci-test
          CLOUD_API_KEY=ci-test-key
          CLOUD_API_SECRET=ci-test-secret

          EMAIL_USER=ci@example.com
          EMAIL_PASS=ci-test-password

          GEMINI_API_KEY=ci-test-gemini-key
          EOF

          cat <<'EOF' > .env
          DB_PASSWORD=ci_test_password
          DB_NAME=portfolio_ci
          EOF

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Images
        run: docker compose build

      - name: Start Containers
        run: docker compose up -d

      - name: Wait for Services
        run: |
          echo "Waiting for containers..."

          for i in {1..12}
          do
            if curl -fs http://localhost:5000/api/projects > /dev/null; then
              echo "Backend is ready."
              break
            fi

            echo "Waiting..."
            sleep 5
          done

      - name: Test Backend API
        run: |
          STATUS=$(curl \
            --write-out "%{http_code}" \
            --silent \
            --output /dev/null \
            http://localhost:5000/api/projects)

          if [ "$STATUS" = "200" ]; then
            echo "Backend API OK ($STATUS)"
          else
            echo "Backend API Failed ($STATUS)"
            docker compose logs server
            exit 1
          fi


      - name: Test Admin Authentication + CSRF
        run: |
          rm -f /tmp/cookies.txt
          LOGIN=$(curl -sS -c /tmp/cookies.txt -b /tmp/cookies.txt \
            -H "Content-Type: application/json" \
            -X POST http://localhost:5000/api/auth/login \
            -d '{"email":"admin@example.com","password":"password"}')

          echo "$LOGIN" | grep -q '"success":true'
          CSRF=$(echo "$LOGIN" | sed -n 's/.*"csrfToken":"\([^"]*\)".*/\1/p')
          test -n "$CSRF"

          ME_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -b /tmp/cookies.txt http://localhost:5000/api/auth/me)
          test "$ME_STATUS" = "200"

          LOGOUT_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -b /tmp/cookies.txt -H "X-CSRF-Token: $CSRF" \
            -X POST http://localhost:5000/api/auth/logout)
          test "$LOGOUT_STATUS" = "200"

      - name: Test Frontend
        run: |
          STATUS=$(curl \
            --write-out "%{http_code}" \
            --silent \
            --output /dev/null \
            http://localhost)

          if [ "$STATUS" = "200" ]; then
            echo "Frontend OK ($STATUS)"
          else
            echo "Frontend Failed ($STATUS)"
            docker compose logs client
            exit 1
          fi

      - name: Upload Logs on Failure
        if: failure()
        run: |
          mkdir logs
          docker compose logs > logs/docker.log

      - name: Upload Workflow Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: logs

      - name: Stop Containers
        if: always()
        run: docker compose down -v
